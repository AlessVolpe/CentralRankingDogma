name: Commit message policy

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  commit-messages:
    name: Validate scoped commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # The PR merge base, PR head and old push SHA must all be available.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Test commit policy validator
        run: python3 -m unittest discover -s tests -p 'test_commit_messages.py' -v
      - name: Validate pull request title and new commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          CHECKED_OUT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            base="$(git merge-base "${PR_BASE}" "${PR_HEAD}")"
            python3 scripts/check_commit_messages.py \
              --title "${PR_TITLE}" --range "${base}..${PR_HEAD}"
          elif [[ "${EVENT_NAME}" == "push" ]]; then
            if [[ "${PUSH_BEFORE}" =~ ^0+$ ]]; then
              python3 scripts/check_commit_messages.py --commit "${CHECKED_OUT_SHA}"
            else
              python3 scripts/check_commit_messages.py \
                --range "${PUSH_BEFORE}..${CHECKED_OUT_SHA}"
            fi
          else
            echo "Unsupported event: ${EVENT_NAME}" >&2
            exit 1
          fi
