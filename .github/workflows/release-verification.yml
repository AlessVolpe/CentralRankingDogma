name: Release configuration and benchmark smoke

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-release:
    name: Linux / GCC / Release / installed consumer
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Configure optimized library and benchmarks
        run: >-
          cmake -S . -B build-release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCRD_BUILD_BENCHMARKS=ON
          -DCRD_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build-release --parallel
      - name: Verify Release CTests including benchmark smoke
        run: ctest --test-dir build-release --output-on-failure
      - name: Benchmark reproducible workloads
        run: |
          ./build-release/crd-bench 1000 3 > benchmark-1000.csv
          ./build-release/crd-bench 10000 3 > benchmark-10000.csv
      - name: Install library into a disposable prefix
        run: cmake --install build-release --prefix "$PWD/stage"
      - name: Verify installed JSON CLI through independent Python subprocess
        run: |
          test -x "$PWD/stage/bin/crd-json"
          CRD_INSTALLED_JSON_BINARY="$PWD/stage/bin/crd-json" \
            python3 -m unittest discover -s tests -p test_installed_json_consumer.py -v
      - name: Configure and build independent package consumer
        run: |
          cmake -S examples/external_consumer -B build-consumer -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/stage"
          cmake --build build-consumer
          ctest --test-dir build-consumer --output-on-failure
      - name: Upload benchmark CSV
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: crd-release-benchmarks
          path: benchmark-*.csv
          if-no-files-found: ignore
          retention-days: 14
