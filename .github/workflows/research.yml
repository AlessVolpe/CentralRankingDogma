name: Research methodology smoke

# These job IDs are required branch-protection checks. Never path-filter this
# entire workflow: GitHub leaves required checks pending when it is skipped.
# Feature branches run only for pull requests; master runs once after merge.
on:
  push:
    branches: [ master ]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-profile-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure native instrumented benchmark
        run: >-
          cmake -S . -B build-profile -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCRD_BUILD_BENCHMARKS=ON
          -DCRD_RESEARCH_PROFILE=ON
          -DCRD_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build-profile --parallel
      - name: Regression suite (no timing thresholds)
        run: ctest --test-dir build-profile --output-on-failure
  python-methodology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned research dependencies
        run: python -m pip install -r research/requirements.txt
      - name: Static analysis smoke and example
        run: |
          python -m pytest -q research/tests
          python research/tools/analyze.py --pair research/examples/observations.csv research/examples/summary.csv --output research/output/demo
