name: Research memory profiling

# Optional, comparatively expensive diagnostic check. Never mark this workflow
# as required in branch protection: unrelated PRs legitimately skip it.
# Always possible to rerun explicitly from Actions / Run workflow.
on:
  pull_request:
    paths:
      - 'benchmarks/memory_compare.c'
      - 'research/tools/memory_profile.py'
      - 'research/tools/run_experiments.py'
      - 'research/tools/verify_evidence.py'
      - 'research/config/**'
      - 'native/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - '.github/workflows/research-memory.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-memory-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  massif-memory-smoke:
    # Pin the environment for repeatable Valgrind/glibc smoke results.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install full-process heap profiler
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Validate Massif availability
        run: |
          valgrind --version
          ldd --version | head -n 1
          valgrind --tool=massif --massif-out-file=/tmp/massif-preflight.out /bin/true
      - name: Configure ranking memory comparison
        run: >-
          cmake -S . -B build-memory -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCRD_BUILD_BENCHMARKS=ON
          -DCRD_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build-memory --parallel
      - name: Capture actual heap peaks for both backends
        run: |
          python research/tools/memory_profile.py --output research/output/ci-heap -- ./build-memory/crd-memory-compare 8 heap 5489
          python research/tools/memory_profile.py --output research/output/ci-avl -- ./build-memory/crd-memory-compare 8 avl 5489
          python - <<'PY'
          import csv
          from pathlib import Path
          left = list(csv.DictReader((Path('research/output/ci-heap/stdout.csv')).open()))
          right = list(csv.DictReader((Path('research/output/ci-avl/stdout.csv')).open()))
          assert len(left) == len(right) == 1
          assert left[0]['checksum'] == right[0]['checksum']
          PY
      - name: Upload Massif smoke evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: massif-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            research/output/ci-heap/
            research/output/ci-avl/
          if-no-files-found: warn
          retention-days: 14
